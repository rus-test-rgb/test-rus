<title>Тесты по русскому языку (2 семестр)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#3b6cf6;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--ac:#6b8dff;--bd:#2c303c}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--ac:#6b8dff;--bd:#2c303c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 12px;line-height:1.3}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.topic{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.topic b{display:block}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.box{flex:none;width:20px;height:20px;border:2px solid var(--mu);margin-top:1px}
.r .box{border-radius:50%}.c .box{border-radius:5px}
.sel .box{background:var(--ac);border-color:var(--ac)}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;font-family:inherit;margin:14px 0;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn:disabled{opacity:.4}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-bottom:6px}
.tm.low{color:var(--bad);font-weight:700}
select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px}
.tag.ok{background:var(--ok);color:#fff}.tag.no{background:var(--bad);color:#fff}
footer{text-align:center;color:var(--mu);font-size:13px;padding:8px 16px 24px}

html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;min-height:100vh;min-height:100dvh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,select{touch-action:manipulation;-webkit-appearance:none;appearance:none}
select{font-size:16px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.btn,.opt,.topic{min-height:48px}
.btn:active,.opt:active,.topic:active{transform:scale(.985)}
</style></head><body><div id="app"></div><footer>Created by Sobirov Ibrohimkhon</footer>

const $=document.getElementById('app');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

  h+=q.a.map((o,n)=>`<button class="opt ${q.k==='x'?'c':'r'}${a.includes(n)?' sel':''}" data-n="${n}"><span class="box"></span><span>${esc(o[0])}</span></button>`).join('')}
